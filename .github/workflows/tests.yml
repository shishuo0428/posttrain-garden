name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  training:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum, latest-compatible]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install -e '.[train]' transformers==4.51.0 trl==0.17.0 peft==0.11.0 datasets==3.0.0
      - if: matrix.dependencies == 'latest-compatible'
        run: python -m pip install -e '.[train]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          PTG_TEST_TRAIN: '1'
          HF_HUB_OFFLINE: '1'
          HF_DATASETS_OFFLINE: '1'
